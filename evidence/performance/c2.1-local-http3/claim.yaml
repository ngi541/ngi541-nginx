schema_version: 1

claim:
  id: c2.1-local-http3-throughput
  status: accepted
  scope: preliminary-local
  statement: >
    In the current NGINX HTTP/3 integration, NGI541 reaches parity with the
    stock OpenSSL path at low concurrency and shows a repeatable approximately
    4-6% median throughput advantage in sustained multi-connection 16 KiB
    workloads.

supported_by:
  experiment: experiments/c2.1-local-http3
  processed_summary: experiments/c2.1-local-http3/processed/summary.csv
  primary_points:
    - payload_bytes: 16384
      workers: 2
      clients: 16
      baseline_median_rps: 8786.95
      ngi541_median_rps: 9283.03
      median_delta_percent: 5.65
      paired_delta_percent: 5.19
      ngi541_wins: 5
      repetitions: 5

    - payload_bytes: 16384
      workers: 4
      clients: 16
      baseline_median_rps: 9082.30
      ngi541_median_rps: 9456.88
      median_delta_percent: 4.12
      paired_delta_percent: 5.17
      ngi541_wins: 5
      repetitions: 5

qualifiers:
  - the experiment used a single-host loopback topology
  - client and server shared CPU resources
  - the 2-worker/8-client accepted set contains two pathological NGI541 drops
  - the 4-worker/32-client workload is affected by host saturation
  - per-run machine-readable measurement output was not preserved
  - the exact final corrected NGINX benchmark executable was not preserved

not_claimed:
  - universal OpenSSL performance superiority
  - latency improvement
  - CPU-efficiency improvement
  - cycles-per-byte improvement
  - energy-efficiency improvement
  - cross-platform superiority
  - AMD performance
  - ARM64 performance
  - causal attribution exclusively to AES-GCM
  - bit-identical historical reproduction

supersession:
  expected_by: dedicated-client-server-campaign
