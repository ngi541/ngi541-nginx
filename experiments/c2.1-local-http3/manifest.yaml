schema_version: 1

experiment:
  id: c2.1-local-http3
  class: preliminary-local
  status: frozen
  date: 2026-10-07
  workload: nginx-http3

software:
  ngi541:
    version: 0.1.1

    historical_source:
      base_commit: f783e4cf99aa20d68b64cc893a60c257c02898e6
      working_tree_changes_preserved: true
      description: >
        The accepted benchmark phase used the base commit plus uncommitted
        direct-prepared AES-GCM/AES-CTR working-tree changes preserved by the
        forensic audit.

    canonical_c2_1_source:
      commit: e78865845aaa033330b00892388d9d5af749d971
      byte_identical_to_historical_source: false
      note: >
        The canonical commit includes a post-benchmark correction restoring
        NOT_INITIALIZED error precedence for invalid prepared-execution calls.
        The correction does not add an engine-state check to valid prepared-key
        execution.

    historical_runtime:
      build_type: Release
      c_compiler: /usr/bin/clang
      c_flags_release: "-O3 -DNDEBUG -mavx2"
      sha256: f63e60ba04e5f2cdd4876f0ac416e17c4e533658b68b6e732a4dba5ee9f96f3e

  nginx:
    version: 1.31.6
    exact_corrected_benchmark_binary_preserved: false

  server_openssl:
    version: 3.5.9

  client:
    curl:
      version: 8.22.0
      http3: true
    openssl:
      version: 3.6.4
    ngtcp2:
      version: 1.25.0
    nghttp3:
      version: 1.18.0

environment:
  class: local
  topology: T0
  host:
    os: macOS 12.7.6
    kernel: Darwin 21.6.0
    architecture: x86_64
    cpu: Intel Core i7-4770HQ
    cpu_frequency_ghz: 2.20
    relevant_isa:
      - AES-NI
      - PCLMULQDQ
      - AVX2

network:
  transport: QUIC
  application_protocol: HTTP/3
  endpoint: 127.0.0.1:8443
  path: loopback

crypto:
  tls_version: TLSv1.3
  cipher_suite: TLS_AES_128_GCM_SHA256
  cipher_suite_selection:
    nginx_config_forces_suite: false
    benchmark_client_forces_suite: true
  ngi541_execution:
    packet_protection: AES-128-GCM
    header_protection: AES-based QUIC header protection via prepared AES-CTR execution

measurement:
  primary_metric: completed_http3_requests_per_second
  clock: time.perf_counter_ns
  warmup:
    concurrent_runners:
      requests_per_client: 50
    note: >
      The historical 2-worker and 4-worker runners explicitly used 50 warm-up
      requests per client. Exact invocation lines for every accepted checkpoint
      were not preserved.
  repetition_policy:
    exact_invocations_preserved: false
    known:
      "16384-2w-8c": 10
      "16384-2w-16c": 5
      "16384-4w-16c": 5
      "16384-4w-32c": 5
      "1024-2w-16c": 5
    unknown:
      - "16384-1w-1c"

results:
  raw_per_run_measurements_preserved: false
  canonical_summary:
    path: processed/summary.csv
    origin: reconstructed_from_original_benchmark_session_record
  figures:
    - figures/throughput-comparison.svg
    - figures/relative-throughput-delta.svg

historical_artifacts:
  configs_preserved: true
  runners_preserved: true
  payloads_preserved: true
  checksums: historical/SHA256SUMS.txt
  excluded_from_repository:
    - server.key
    - server.crt
    - empty_stdout_logs
    - direct-check.log
    - release-check.log
    - historical_binary_files

limitations:
  - client and server share one physical host
  - traffic uses loopback networking
  - CPU resources are shared between load generation and server
  - raw per-run measurement output containing the accepted RPS values was not preserved
  - exact historical invocation lines are not preserved for every checkpoint
  - the exact corrected NGINX benchmark executable was not preserved byte-for-byte
  - this is not a hermetic bit-for-bit reproduction record
