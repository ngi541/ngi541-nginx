worker_processes 2;
daemon off;

error_log /tmp/ngi541-nginx-ab/logs/error.log notice;
pid /tmp/ngi541-nginx-ab/logs/nginx.pid;

events {
    worker_connections 4096;
}

http {
    access_log off;

    server {
        keepalive_requests 20000;

        listen 127.0.0.1:8443 quic reuseport;

        ssl_certificate     /tmp/ngi541-nginx-ab/conf/server.crt;
        ssl_certificate_key /tmp/ngi541-nginx-ab/conf/server.key;
        ssl_protocols TLSv1.3;

        root /tmp/ngi541-nginx-ab/html;

        location / {
        }
    }
}
